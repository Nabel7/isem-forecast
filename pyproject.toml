[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isem-forecast"
version = "0.1.0"
description = "Forecasting Irish day-ahead electricity prices (I-SEM), tested walk-forward against simple baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nabel Sodipe" }]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.2", "ruff>=0.6", "pre-commit>=3.5"]
# Pre-trained forecasting models (Chronos-2). Large: PyTorch and its friends, about 1 GB.
foundation = ["chronos-forecasting>=2.3,<3"]
# A model fitted on Irish data (LightGBM, gradient-boosted trees). Small: about 50 MB.
gbm = ["lightgbm>=4.5", "scikit-learn>=1.3"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["isem_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
